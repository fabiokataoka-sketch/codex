<style>
  :root{ --bg:oklch(22.46% .0505 261.69); --fg:oklch(97.06% .0057 84.57);
         --gold:oklch(72.98% .1151 85.76); --goldfg:oklch(22.46% .0505 261.69);
         --border:oklch(34% .045 262); --muted:oklch(72.4% .0388 265.05);
         --surface:oklch(25.22% .0562 264); }
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:630px;overflow:hidden;background:var(--bg);color:var(--fg);
       font-family:Manrope,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{position:relative;width:1200px;height:630px;display:grid;grid-template-columns:1fr 430px;
        background:radial-gradient(120% 100% at 8% 0%, oklch(27% .062 262) 0%, var(--bg) 62%)}
  .grid{position:absolute;inset:0;opacity:.5;
        background-image:linear-gradient(oklch(40% .04 262 / .16) 1px,transparent 1px),
                         linear-gradient(90deg,oklch(40% .04 262 / .16) 1px,transparent 1px);
        background-size:64px 64px;
        -webkit-mask-image:radial-gradient(70% 70% at 20% 40%,#000,transparent)}
  .left{position:relative;padding:74px 0 66px 72px;display:flex;flex-direction:column;justify-content:space-between}
  .eyebrow{font-size:15px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
  h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:66px;line-height:1.03;
     letter-spacing:-.018em;margin:26px 0 0;max-width:14ch}
  .sub{margin-top:24px;font-size:20px;line-height:1.5;color:var(--muted);max-width:34ch}
  .foot{border-top:1px solid var(--border);padding-top:26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .url{font-size:19px;font-weight:600;color:var(--fg)}
  .dot{width:5px;height:5px;border-radius:99px;background:var(--border)}
  .langs{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .badge{position:absolute;top:56px;right:44px;background:var(--gold);color:var(--goldfg);
         font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
         padding:8px 16px;border-radius:999px;z-index:3}
  .right{position:relative;display:flex;align-items:flex-end;justify-content:center}
  .phone{position:absolute;bottom:-46px;width:330px;border-radius:34px;border:1px solid var(--border);
         box-shadow:0 44px 90px oklch(12% .03 262 / .62);overflow:hidden;background:var(--surface)}
  .phone img{display:block;width:100%}
  .glow{position:absolute;right:-120px;top:-140px;width:520px;height:520px;border-radius:50%;
        background:radial-gradient(circle,oklch(72.98% .1151 85.76 / .14),transparent 62%)}
</style></head><body>
