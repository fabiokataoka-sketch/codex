<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipForge Studio</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  body.noauth { display: block; }
  aside { border-right: 1px solid var(--border); background: var(--surface); padding: 16px 12px; position: sticky; top: 0; height: 100vh; overflow: auto; }
  aside .logo { margin: 4px 8px 16px; font-size: 19px; }
  aside nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--muted); font-size: 14px; }
  aside nav a:hover { background: var(--surface-2); color: var(--text); }
  aside nav a.on { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  aside .group { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 14px 10px 4px; }
  main { padding: 24px; min-width: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .topbar h1 { font-size: 24px; margin: 0; letter-spacing: -.02em; }
  .credits { font-weight: 600; }
  .cols-2 { grid-template-columns: 1fr 1fr; } .cols-3 { grid-template-columns: repeat(3, 1fr); } .cols-4 { grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 900px) { body { grid-template-columns: 1fr; } aside { position: static; height: auto; } .cols-2, .cols-3, .cols-4 { grid-template-columns: 1fr; } }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .clip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
  .clip { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface); }
  .thumb { aspect-ratio: 9/16; display: flex; align-items: flex-end; justify-content: center; color: #fff; font-weight: 700; font-size: 13px; padding: 12px; text-align: center; text-shadow: 0 1px 3px #000a; position: relative; }
  .thumb .score { position: absolute; top: 8px; right: 8px; background: #000a; padding: 2px 8px; border-radius: 999px; font-size: 12px; }
  .clip .meta { padding: 10px; font-size: 13px; display: grid; gap: 6px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .editor { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
  @media (max-width: 900px) { .editor { grid-template-columns: 1fr; } }
  .stage { aspect-ratio: 9/16; border-radius: 14px; overflow: hidden; position: relative; background: #111; }
  .stage.r1x1 { aspect-ratio: 1/1; } .stage.r4x5 { aspect-ratio: 4/5; } .stage.r16x9 { aspect-ratio: 16/9; }
  .stage video, .stage .bg { width: 100%; height: 100%; object-fit: cover; }
  .stage .cap { position: absolute; left: 8%; right: 8%; bottom: 18%; text-align: center; font-weight: 800; font-size: 20px; color: #fff; text-shadow: 0 2px 6px #000; }
  .stage .cap.center { bottom: 45%; } .stage .cap.bottom { bottom: 6%; }
  .stage .wm { position: absolute; right: 8px; bottom: 8px; font-size: 11px; color: #fffa; }
  .timeline { position: relative; height: 54px; background: var(--surface-2); border-radius: 8px; overflow: hidden; }
  .timeline .cue { position: absolute; top: 8px; height: 38px; background: var(--primary); opacity: .75; border-radius: 4px; font-size: 10px; color: #fff; padding: 2px 4px; overflow: hidden; white-space: nowrap; }
  .heatmap { display: grid; grid-template-columns: 40px repeat(24, 1fr); gap: 2px; font-size: 10px; }
  .heatmap div { height: 16px; border-radius: 2px; }
  .bar { height: 10px; border-radius: 99px; background: var(--primary); }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .tabs button { border: 1px solid var(--border); background: var(--surface); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .tabs button.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .auth { max-width: 400px; margin: 10vh auto; }
  .stat { font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
  .test-ok { color: var(--ok); } .test-bad { color: var(--bad); }
  .empty { text-align: center; padding: 40px; color: var(--muted); border: 1px dashed var(--border); border-radius: 12px; }
  .drop { border: 2px dashed var(--border); border-radius: 12px; padding: 24px; text-align: center; color: var(--muted); cursor: pointer; }
  .drop.over { border-color: var(--primary); background: var(--primary-soft); }
</style>
</head>
<body>
<aside id="side"></aside>
<main id="view"></main>
<div class="toast-wrap" id="toasts"></div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
